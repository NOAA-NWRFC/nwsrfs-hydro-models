[workspace]
name = "nwsrfs-hydro-models"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
# Python
python = ">=3.10,<3.13"
numpy = "*"
pandas = "*"
scipy = "*"
pip = "*"
# Build tools
meson = "*"
meson-python = "*"
ninja = "*"
# Fortran compiler
fortran-compiler = "*"
c-compiler = "*"
# R
r-base = ">=4.1"
# Testing
pytest = "*"
r-testthat = "*"
# R dev tools
r-devtools = "*"
r-roxygen2 = "*"

[tasks]
install-py = { cmd = "pip install --no-build-isolation -e nwsrfs_py", description = "Install Python package (editable)" }
install-r = { cmd = "R CMD INSTALL nwsrfs_r", description = "Install R package" }
test-py = { cmd = "pytest nwsrfs_py/tests/ -v -s", depends-on = ["install-py"], description = "Run Python tests" }
test-r = { cmd = "RENV_CONFIG_AUTOLOADER_ENABLED=FALSE Rscript -e \"testthat::test_check('nwsrfsr')\"", cwd = "nwsrfs_r/tests", depends-on = ["install-r"], description = "Run R tests" }
check-r = { cmd = "R CMD check nwsrfs_r --no-manual", depends-on = ["install-r"], description = "R CMD check" }
test-all = { depends-on = ["test-py", "test-r"], description = "Run all tests" }
build-docs = { cmd = "cd nwsrfs_py/docs && make html", description = "Build Python docs" }
