[workspace]
name = "nwsrfs-hydro-models"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
# Python
python = ">=3.10,<3.13"
numpy = "*"
pandas = "*"
scipy = "*"
pip = "*"
# Build tools
meson = "*"
meson-python = "*"
ninja = "*"
# Fortran compiler
fortran-compiler = "*"
c-compiler = "*"
# R
r-base = ">=4.1"
# Testing
pytest = "*"
r-testthat = "*"
# R dev tools
r-devtools = ">=2.4.6,<3"
r-roxygen2 = "*"
r-pkgdown = "*"
sphinx = ">=5,<6"
sphinx-autodoc-typehints = "*"
sphinx_rtd_theme = "*"
quarto = ">=1.8.27,<2"
tidy-html5 = ">=5.9.14,<6"
twine = ">=6.2.0,<7"
python-build = ">=1.4.0,<2"

[tasks]
clean-py-src-artifacts = { cmd = "python -c \"import os; exts={'.mod','.smod','.o','.so','.dylib','.a','.obj','.dll','.lib'}; root='model_source'; [os.remove(os.path.join(dp,f)) for dp,_,fs in os.walk(root) for f in fs if os.path.splitext(f)[1].lower() in exts]\"", description = "Remove stale compiled Fortran artifacts from model_source" }
install-py = { cmd = "pip install --no-build-isolation -e nwsrfs_py", cwd = ".", depends-on = ["clean-py-src-artifacts"], description = "Install Python package (editable)" }
install-r = { cmd = "R CMD INSTALL nwsrfs_r", description = "Install R package" }
test-py = { cmd = "pytest nwsrfs_py/tests/ -v -s", cwd = ".", depends-on = ["install-py"], description = "Run Python tests" }
test-r = { cmd = "Rscript -e \"Sys.setenv(RENV_CONFIG_AUTOLOADER_ENABLED='FALSE'); testthat::test_check('nwsrfsr')\"", cwd = "nwsrfs_r/tests", depends-on = ["install-r"], description = "Run R tests" }
build-r = { cmd = "R CMD build nwsrfs_r", depends-on = ["install-r"], description = "Build R source tarball" }
check-r = { cmd = "R CMD check nwsrfsr_*.tar.gz --no-manual", depends-on = ["install-r", "build-r"], description = "R CMD check (no manual)" }
check-r-cran = { cmd = "Rscript -e \"f <- Sys.glob('nwsrfsr_*.tar.gz'); if (length(f) != 1) stop('Expected one nwsrfsr_*.tar.gz file'); status <- system2('R', c('CMD','check','--as-cran', f)); if (!identical(status, 0L)) quit(status = status)\"", depends-on = ["install-r", "build-r"], description = "CRAN submission check on built tarball" }
test-all = { depends-on = ["test-py", "test-r"], description = "Run all tests" }
clean-docs-py = { cmd = "python -m sphinx -M clean nwsrfs_py/docs/source nwsrfs_py/docs/build", cwd = ".", description = "Cleans Python Sphinx docs" }
build-docs-py = { cmd = "python -m sphinx -M html nwsrfs_py/docs/source nwsrfs_py/docs/build", cwd = ".", depends-on = ["clean-docs-py"], description = "Build Python Sphinx docs" }
build-docs-r = { cmd = "Rscript -e \"Sys.setenv(RENV_CONFIG_AUTOLOADER_ENABLED='FALSE'); pkgdown::build_site(pkg='nwsrfs_r', install=FALSE, preview=FALSE)\"", depends-on = ["install-r"], description = "Build R pkgdown docs" }
build-docs-r-readme = { cmd = "quarto render README.qmd --to html -M embed-resources:true -o README.html", cwd = "nwsrfs_r", description = "Build R README.html" }
build-docs = { depends-on = ["build-docs-py", "build-docs-r", "build-docs-r-readme"], description = "Build all docs" }

[environments]
default = { features = []} 
py310 = { features = ["py310"] }
py311 = { features = ["py311"]}
py312 = { features = ["py312"]}

[feature.py310.dependencies]
python = "3.10.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"
