# R-hub v2 checks (extended platform coverage), adapted for this repo.
#
# Upstream template: https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# The rhub package's local helpers (rhub_setup(), rhub_doctor(), rhub_check())
# refuse to run because they require the R package DESCRIPTION at the repository
# root, and ours lives in nwsrfs_r/. Those helpers are NOT needed: the checks run
# entirely through the r-hub/actions steps below, and each job promotes nwsrfs_r/
# to the workspace root (turning the committed symlinks into real files) before
# any R-hub step touches the package, so R-hub sees a root-level package at run
# time.
#
# HOW TO RUN:
#   1. Merge this workflow to the default branch (main). R-hub only runs from the
#      default branch.
#   2. GitHub -> Actions tab -> "R-hub" -> "Run workflow", and enter platforms in
#      the config box (default "linux,windows,macos"; e.g. "gcc-asan,valgrind,nold"
#      for the extended container checks).
#
# No RHUB_TOKEN secret is required for this public repository -- the token input
# on the r-hub/actions steps is only needed for private-repo access, and an unset
# secret resolves to the action's default (empty). If the repo is ever made
# private, add an RHUB_TOKEN secret (a GitHub PAT with repo scope).

name: R-hub
run-name: "${{ github.event.inputs.id }}: ${{ github.event.inputs.name || format('Manually run by {0}', github.triggering_actor) }}"

on:
  workflow_dispatch:
    inputs:
      config:
        description: "A comma separated list of R-hub platforms to use."
        type: string
        default: "linux,windows,macos"
      name:
        description: "Run name. You can leave this empty now."
        type: string
      id:
        description: "Unique ID. You can leave this empty now."
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
      # NO NEED TO CHECKOUT HERE
      - uses: r-hub/actions/setup@v1
        with:
          config: ${{ github.event.inputs.config }}
        id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - name: Promote subdirectory package to root
        shell: bash
        run: |
          # R-hub checks the repository root, but the package is in nwsrfs_r/.
          # Assemble a clean package tree (with symlinks turned into copies) in a
          # scratch dir, wipe the workspace, then restore only the package so
          # R CMD build does not sweep in sibling dirs (nwsrfs_py/, pages/, ...).
          set -euxo pipefail
          pkg="$RUNNER_TEMP/pkg"
          rm -rf "$pkg" && mkdir -p "$pkg"
          shopt -s dotglob
          cp -R nwsrfs_r/* "$pkg"/
          rm -rf "$pkg/src" && cp -R model_source "$pkg/src"
          rm -f "$pkg/NOTICE" && cp NOTICE "$pkg/NOTICE"
          find "$pkg/src" -type f \
            \( -name '*.o' -o -name '*.so' -o -name '*.dylib' -o -name '*.a' \
            -o -name '*.mod' -o -name '*.smod' -o -name '*.obj' -o -name '*.dll' \
            -o -name '*.lib' \) -delete
          rm -rf ./*
          cp -R "$pkg"/* .
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - name: Promote subdirectory package to root
        shell: bash
        run: |
          # R-hub checks the repository root, but the package is in nwsrfs_r/.
          # Assemble a clean package tree (with symlinks turned into copies) in a
          # scratch dir, wipe the workspace, then restore only the package so
          # R CMD build does not sweep in sibling dirs (nwsrfs_py/, pages/, ...).
          set -euxo pipefail
          pkg="$RUNNER_TEMP/pkg"
          rm -rf "$pkg" && mkdir -p "$pkg"
          shopt -s dotglob
          cp -R nwsrfs_r/* "$pkg"/
          rm -rf "$pkg/src" && cp -R model_source "$pkg/src"
          rm -f "$pkg/NOTICE" && cp NOTICE "$pkg/NOTICE"
          find "$pkg/src" -type f \
            \( -name '*.o' -o -name '*.so' -o -name '*.dylib' -o -name '*.a' \
            -o -name '*.mod' -o -name '*.smod' -o -name '*.obj' -o -name '*.dll' \
            -o -name '*.lib' \) -delete
          rm -rf ./*
          cp -R "$pkg"/* .
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
