name: Publish Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints numpy pandas scipy

      - name: Build Sphinx docs (Python package)
        run: |
          sphinx-build -b html nwsrfs_py/docs/source _site/python

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: nwsrfs_r
          extra-packages: any::pkgdown
          needs: website

      - name: Build pkgdown site (R package)
        run: |
          Rscript -e 'if (!requireNamespace("pkgdown", quietly = TRUE)) install.packages("pkgdown", repos = "https://cloud.r-project.org")'
          Rscript -e 'pkgdown::build_site(pkg = "nwsrfs_r", install = TRUE, preview = FALSE, new_process = FALSE)'
          mkdir -p _site/r
          cp -R nwsrfs_r/docs/. _site/r/

      - name: Add site landing page and Pages metadata
        run: |
          cp pages/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
