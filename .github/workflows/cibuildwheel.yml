name: Build Wheels (cibuildwheel)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build_wheels:
    name: Build ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]

    env:
      # Oldest macOS the published wheels support. Read by the toolchain guard in the macOS
      # Fortran step and passed through to cibuildwheel, so the two cannot drift apart.
      # The /opt/gfortran runtime targets macOS 11, so this floor can be lowered without
      # changing the toolchain. Ignored on Linux and Windows.
      WHEEL_MACOS_TARGET: "15.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        # Keep this pinned for reproducibility; update intentionally when moving toolchain baselines.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Fortran compiler
        if: runner.os == 'Linux'
        run: |
          # Manylinux images used by cibuildwheel do not guarantee gfortran availability for meson metadata/build.
          # If Linux runner images change, this may need revisiting.
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version

      - name: Install macOS Fortran compiler
        if: runner.os == 'macOS'
        run: |
          # CRAN's universal gfortran, the same toolchain dev/README.md prescribes for the R
          # package. Its libgfortran/libquadmath/libgcc_s target macOS 11, so delocate can
          # bundle them into a wheel built for an older macOS than the runner.
          #
          # Homebrew's gcc does not work here. Its bottles are built for the runner's own
          # macOS, so when macos-latest moved from macOS 15 to macOS 26 the runtime picked up
          # a 26.0 minimum and delocate refused to repair the 15.0-tagged wheel.
          set -euo pipefail
          curl -fLO https://mac.r-project.org/tools/gfortran-14.2-universal.pkg
          sudo installer -pkg gfortran-14.2-universal.pkg -target /
          rm -f gfortran-14.2-universal.pkg
          echo "/opt/gfortran/bin" >> "$GITHUB_PATH"
          /opt/gfortran/bin/gfortran --version

          # Assert the property this toolchain was chosen for. If a future gfortran build
          # raises its runtime target above the wheel floor, fail here with a clear message
          # rather than deep inside cibuildwheel's delocate step.
          target_major="${WHEEL_MACOS_TARGET%%.*}"
          for lib in libgfortran.5 libquadmath.0 libgcc_s.1.1; do
            path="$(find /opt/gfortran/lib/gcc -name "$lib.dylib" -path '*aarch64*' | head -n1)"
            if [ -z "$path" ]; then
              echo "::error::$lib.dylib not found under /opt/gfortran; toolchain layout changed"
              exit 1
            fi
            minos="$(otool -l "$path" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')"
            echo "$lib minos=$minos (wheel floor ${WHEEL_MACOS_TARGET})"
            if [ "${minos%%.*}" -gt "$target_major" ]; then
              echo "::error::$lib targets macOS $minos, above the ${WHEEL_MACOS_TARGET} wheel floor"
              exit 1
            fi
          done

      - name: Install Windows Fortran compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          # MinGW runtime DLL names/locations may change; keep aligned with delvewheel repair path below.
          install: >-
            mingw-w64-x86_64-gcc-fortran

      - name: Add Windows MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # If MSYS2 path layout changes on GitHub runners, update this path and delvewheel --add-path.
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"
          gfortran --version

      - name: Materialize package links for build
        shell: bash
        run: |
          # Required because src/LICENSE/NOTICE are symlinked in repo; wheel/sdist contexts may not preserve links.
          # If repository layout changes, update these copy paths.
          set -euxo pipefail
          rm -rf nwsrfs_py/src
          cp -R model_source nwsrfs_py/src
          rm -f nwsrfs_py/LICENSE
          cp LICENSE nwsrfs_py/LICENSE
          rm -f nwsrfs_py/NOTICE
          cp NOTICE nwsrfs_py/NOTICE
          find nwsrfs_py/src -type f \( -name '*.o' -o -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.mod' -o -name '*.smod' \) -delete

      - name: Install cibuildwheel
        run: |
          # Pinned for reproducibility and to avoid behavior drift in wheel build bootstrap.
          # Revisit periodically (or when CI starts failing) and bump intentionally after validating all OS jobs.
          python -m pip install --upgrade "cibuildwheel==3.1.4"

      - name: Build wheels (retry on transient network/rate-limit failures)
        uses: nick-fields/retry@v3
        env:
          # Update python tags intentionally when support policy changes (e.g., add cp313, drop cp310).
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-manylinux_i686 *-musllinux_* *-win32"
          CIBW_BUILD_VERBOSITY: "1"
          # Internal cibuildwheel test env can trigger heavy source builds (e.g., scipy/openblas). We run explicit
          # smoke tests later instead.
          CIBW_TEST_SKIP: "*"
          CIBW_BEFORE_BUILD: "python -m pip install --upgrade pip"
          # Keep delvewheel pinned via pip resolver behavior in this environment; if Windows import fails again,
          # re-check bundled DLLs and this repair command.
          CIBW_BEFORE_BUILD_WINDOWS: "python -m pip install --upgrade pip delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:/msys64/mingw64/bin -w {dest_dir} {wheel}"
          # delocate reads MACOSX_DEPLOYMENT_TARGET to decide whether the bundled dylibs are
          # old enough for the wheel tag, so it has to be set for the repair step too, not just
          # the compile. Without it delocate silently renames the wheel up to the runner's macOS.
          # FC is pinned so meson cannot pick up some other gfortran that lands on PATH.
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=${{ env.WHEEL_MACOS_TARGET }} FC=/opt/gfortran/bin/gfortran"
        with:
          # GitHub can occasionally return 429 while cibuildwheel fetches virtualenv.pyz.
          # Retry the whole build to avoid failing on transient infrastructure errors.
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 30
          command: python -m cibuildwheel nwsrfs_py --output-dir wheelhouse

      - name: Validate wheel metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check wheelhouse/*.whl

      - name: Smoke test install from built wheel artifact
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: numpy pandas scipy
          python -c "import glob,sys,subprocess; tag=f'cp{sys.version_info.major}{sys.version_info.minor}'; wheels=[w for w in glob.glob('wheelhouse/*.whl') if tag in w]; assert wheels, f'No wheel found for {tag} in wheelhouse'; wheel=sorted(wheels)[0]; print(f'Installing {wheel}'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheel]); import nwsrfs_py; from nwsrfs_py import simulation, adjustq; print('artifact install smoke test ok')"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
