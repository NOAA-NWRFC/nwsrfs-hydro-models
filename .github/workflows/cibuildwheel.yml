name: Build Wheels (cibuildwheel)

on:
  workflow_dispatch:
  push:
    branches: ["main", "py_compile_updates"]
    tags: ["v*"]

jobs:
  build_wheels:
    name: Build ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        # Keep this pinned for reproducibility; update intentionally when moving toolchain baselines.
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # --- Fortran Compiler Setup per OS ---

      # Note: Linux gfortran is installed inside the Docker container via 
      # CIBW_BEFORE_ALL_LINUX in the "Build wheels" step below, so no host step is needed here.

      # macOS compiler setup
      - name: Install macOS Fortran compiler
        if: runner.os == 'macOS'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: '13'

      # Windows compiler setup
      - name: Install Windows Fortran compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc-fortran

      - name: Add Windows MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"
          gfortran --version

      # --- Package Preparation ---

      - name: Materialize package links for build
        shell: bash
        run: |
          # Required because src/LICENSE/NOTICE are symlinked in repo; wheel/sdist contexts may not preserve links.
          # If repository layout changes, update these copy paths.
          set -euxo pipefail
          rm -rf nwsrfs_py/src
          cp -R model_source nwsrfs_py/src
          rm -f nwsrfs_py/LICENSE
          cp LICENSE nwsrfs_py/LICENSE
          rm -f nwsrfs_py/NOTICE
          cp NOTICE nwsrfs_py/NOTICE
          find nwsrfs_py/src -type f \( -name '*.o' -o -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.mod' -o -name '*.smod' \) -delete

      - name: Install cibuildwheel
        run: |
          # Pinned for reproducibility and to avoid behavior drift in wheel build bootstrap.
          # Revisit periodically (or when CI starts failing) and bump intentionally after validating all OS jobs.
          python -m pip install --upgrade "cibuildwheel==3.1.4"

      # --- Build Wheels ---

      - name: Build wheels (retry on transient network/rate-limit failures)
        uses: nick-fields/retry@v4
        env:
          # Update python tags intentionally when support policy changes (e.g., add cp313, drop cp310).
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-manylinux_i686 *-musllinux_* *-win32"
          CIBW_BUILD_VERBOSITY: "1"
          # Internal cibuildwheel test env can trigger heavy source builds (e.g., scipy/openblas). We run explicit
          # smoke tests later instead.
          CIBW_TEST_SKIP: "*"
          # Linux: Install gfortran inside the manylinux Docker container
          CIBW_BEFORE_ALL_LINUX: "yum install -y gcc-gfortran || dnf install -y gcc-gfortran || (apt-get update && apt-get install -y gfortran)"
          CIBW_BEFORE_BUILD: "python -m pip install --upgrade pip"
          # Keep delvewheel pinned via pip resolver behavior in this environment; if Windows import fails again,
          # re-check bundled DLLs and this repair command.
          CIBW_BEFORE_BUILD_WINDOWS: "python -m pip install --upgrade pip delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:/msys64/mingw64/bin -w {dest_dir} {wheel}"
          # macOS: Set base deployment target for Apple Silicon compatibility (macOS 11.0+)
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0"
        with:
          # GitHub can occasionally return 429 while cibuildwheel fetches virtualenv.pyz.
          # Retry the whole build to avoid failing on transient infrastructure errors.
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 30
          command: python -m cibuildwheel nwsrfs_py --output-dir wheelhouse

      - name: Validate wheel metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check wheelhouse/*.whl

      - name: Smoke test install from built wheel artifact
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: numpy pandas scipy
          # Change working directory and sys.path[0] to tempdir to avoid source-tree import shadowing
          python -c "import glob, os, sys, subprocess, tempfile; tag = f'cp{sys.version_info.major}{sys.version_info.minor}'; wheels = [w for w in glob.glob('wheelhouse/*.whl') if tag in w]; assert wheels, f'No wheel found for {tag} in wheelhouse'; wheel = sorted(wheels)[0]; print(f'Installing {wheel}'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheel]); os.chdir(tempfile.mkdtemp()); sys.path[0] = os.getcwd(); import nwsrfs_py; from nwsrfs_py import simulation, adjustq; print('artifact install smoke test ok')"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
